<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drum Machine</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <div class="drum-machine">
      <div class="drum" id="kick">
        <img src="./images/kick.jpg" alt="Kick" class="drum-image" />
        <p class="shortcut">Key: Q</p>
      </div>
      <div class="drum" id="snare">
        <img src="./images/snare.jpg" alt="Snare" class="drum-image" />
        <p class="shortcut">Key: W</p>
      </div>
      <div class="drum" id="hihat">
        <img src="./images/hihat.jpg" alt="Hi-Hat" class="drum-image" />
        <p class="shortcut">Key: E</p>
      </div>
      <div class="drum" id="openhat">
        <img src="./images/openhat.jpg" alt="Open Hat" class="drum-image" />
        <p class="shortcut">Key: R</p>
      </div>
      <div class="drum" id="ride">
        <img src="./images/ride.jpg" alt="Ride" class="drum-image" />
        <p class="shortcut">Key: T</p>
      </div>
      <div class="drum" id="clap">
        <img src="./images/clap.jpg" alt="Clap" class="drum-image" />
        <p class="shortcut">Key: Y</p>
      </div>
      <div class="drum" id="tink">
        <img src="./images/tink.png" alt="Tink" class="drum-image" />
        <p class="shortcut">Key: U</p>
      </div>
      <div class="drum" id="tom">
        <img src="./images/tom.jpg" alt="Tom" class="drum-image" />
        <p class="shortcut">Key: I</p>
      </div>
    </div>
  </body>
</html>
